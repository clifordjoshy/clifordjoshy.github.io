name: hugo and latex build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # once a week (so the reading page can be rebuilt)
    - cron: "0 0 * * 0"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Check resume PDF cache
        id: resume-cache
        uses: actions/cache@v4
        with:
          path: static/resume.pdf
          key: resume-${{ hashFiles('resume/**') }}

      - name: Compile Resume
        if: steps.resume-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: main.tex
          post_compile: cp main.pdf ../static/resume.pdf

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          dart-sass-version: "1.107.1"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
